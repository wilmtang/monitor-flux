name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

  release:
    name: DMG release
    runs-on: macos-26
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: APP_VERSION="${{ steps.version.outputs.value }}" ./script/make_dmg.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/MonitorFlux-$VERSION.dmg" \
            --title "$GITHUB_REF_NAME" \
            --notes "MonitorFlux $VERSION" \
            --verify-tag
